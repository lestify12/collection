<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Collection Tracker</title>
  <link rel="stylesheet" href="fonts/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="photos/peacehomeslogo.png">
</head>
<body>
  <nav class="navbar">
    <a class="navbar-logo" href="index.html"><img src="photos/peace-homes-white.png" alt="Peace Homes Development"></a>
    <div class="navbar-divider"></div>
    <div class="navbar-search">
      <i class="ti ti-search search-icon"></i>
      <input type="text" id="projSearch" placeholder="Find a project…" autocomplete="off">
    </div>
    <div class="navbar-right">
      <button class="navbar-icon-btn" id="themeToggle" title="Toggle theme"><i class="ti ti-moon"></i></button>
      <div class="navbar-user">
        <div class="user-info">
          <div class="user-name">Collections</div>
          <div class="user-role">Recovery Tracker</div>
        </div>
        <div class="user-avatar">PH</div>
      </div>
    </div>
  </nav>

  <div class="app-body">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-section-label">Overview</div>
        <a class="sidebar-item" id="navDashboard" href="index.html"><i class="ti ti-layout-dashboard"></i>Dashboard</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-label">Projects</div>
        <div id="navProjects"><div class="sk-nav"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
      </div>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-foot" id="modeBadge">
        <span class="pulse"></span>
        <div>
          <div class="foot-text mode-text">Loading…</div>
          <div class="foot-sub">data source</div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="breadcrumb"><a href="index.html">Projects</a><i class="ti ti-chevron-right"></i><span id="bcName">…</span></div>
      <div class="page-header">
        <div>
          <div class="detail-title">
            <span class="page-title" id="projTitle">Loading…</span>
            <span class="status-badge" id="projStatus">Active</span>
          </div>
          <div class="page-subtitle" id="projSub"></div>
        </div>
        <div class="page-header-actions">
          <button class="btn" id="editProjectBtn" style="display:none"><i class="ti ti-edit"></i> Edit project</button>
          <button class="btn" id="importBtn" style="display:none"><i class="ti ti-upload"></i> Import Excel</button>
          <button class="btn danger" id="deleteProjectBtn" style="display:none"><i class="ti ti-trash"></i> Delete project</button>
          <input type="file" id="importFile" accept=".xlsx,.xls,.csv" hidden>
        </div>
      </div>

      <section class="card">
        <div class="tabs" id="tabs"></div>
        <div id="tabBody">
          <div class="app-loader">
            <div class="app-loader-mark"><span class="app-loader-ring"></span>
              <span class="app-loader-logo"></span></div>
            <div class="app-loader-text">Loading project…</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script type="module" src="js/project.js"></script>
  <script src="js/mobile-nav.js"></script>
</body>
</html>
