<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client — Collection Tracker</title>
  <link rel="stylesheet" href="fonts/tabler-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="photos/peacehomeslogo.png">
</head>
<body>
  <nav class="navbar">
    <a class="navbar-logo" href="index.html"><img src="photos/peace-homes-white.png" alt="Peace Homes Development"></a>
    <div class="navbar-divider"></div>
    <div class="navbar-search">
      <i class="ti ti-search search-icon"></i>
      <input type="text" id="projSearch" placeholder="Find a project…" autocomplete="off">
    </div>
    <div class="navbar-right">
      <button class="navbar-icon-btn" id="themeToggle" title="Toggle theme"><i class="ti ti-moon"></i></button>
      <div class="navbar-user">
        <div class="user-info"><div class="user-name">Collections</div><div class="user-role">Recovery Tracker</div></div>
        <div class="user-avatar">PH</div>
      </div>
    </div>
  </nav>

  <div class="app-body">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-section-label">Overview</div>
        <a class="sidebar-item" id="navDashboard" href="index.html"><i class="ti ti-layout-dashboard"></i>Dashboard</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-label">Projects</div>
        <div id="navProjects"><div class="sk-nav"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
      </div>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-foot" id="modeBadge">
        <span class="pulse"></span>
        <div><div class="foot-text mode-text">Loading…</div><div class="foot-sub">data source</div></div>
      </div>
    </aside>

    <main class="main" id="clientMain">
      <div class="app-loader">
        <div class="app-loader-mark"><span class="app-loader-ring"></span>
          <span class="app-loader-logo"></span></div>
        <div class="app-loader-text">Loading unit…</div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script type="module" src="js/client.js"></script>
  <script src="js/mobile-nav.js"></script>
</body>
</html>
